<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description"><title id="title">Executive summary of median inference speedups</title><desc id="description">Across the benchmark matrix, off-the-shelf ONNX Runtime TensorRT is 1.38 times faster than half-precision torch.compile at the median. The optimized deployment is 2.67 times faster than torch.compile and 1.92 times faster than off-the-shelf TensorRT.</desc><defs>
          <style>
            text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
            .eyebrow { font-size: 15px; font-weight: 500; letter-spacing: 2.1px; fill: #747C7A; }
            .title { font-size: 43px; font-weight: 500; letter-spacing: -1.15px; fill: #171A1B; }
            .row-title { font-size: 21px; font-weight: 500; fill: #252A2A; }
            .row-subtitle { font-size: 15px; font-weight: 400; fill: #747C7A; }
            .value { font-size: 28px; font-weight: 500; letter-spacing: -0.25px; }
            .tick { font-size: 14px; font-weight: 400; fill: #737B79; }
            .callout { font-size: 14px; font-weight: 500; letter-spacing: 1px; fill: #4F7771; }
          </style>
          <filter id="bar-shadow" x="-8%" y="-25%" width="116%" height="160%">
            <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1E2524" flood-opacity="0.075"/>
          </filter>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M8 4 L0 0 L0 8 Z" fill="#5B7F79"/>
          </marker>
        </defs><rect width="1600" height="620" fill="#F4F2ED"/><circle cx="1474" cy="44" r="142" fill="#E6ECEA" opacity="0.68"/><circle cx="1505" cy="17" r="63" fill="#F2E5DF" opacity="0.82"/><text x="62.00" y="56.00" class="eyebrow" >INFERENCE SPEEDUP</text><text x="62.00" y="104.00" class="title" >An already-fast backend, nearly doubled again</text><line x1="786.67" y1="190" x2="786.67" y2="537" stroke="#DCD8D1" stroke-width="1"/><text x="786.67" y="181.00" class="tick" text-anchor="middle">1.0×</text><line x1="1133.33" y1="190" x2="1133.33" y2="537" stroke="#DCD8D1" stroke-width="1"/><text x="1133.33" y="181.00" class="tick" text-anchor="middle">2.0×</text><line x1="1480.00" y1="190" x2="1480.00" y2="537" stroke="#DCD8D1" stroke-width="1"/><text x="1480.00" y="181.00" class="tick" text-anchor="middle">3.0×</text><text x="62.00" y="244.00" class="row-title" >torch.compile</text><text x="62.00" y="269.00" class="row-subtitle" >FP16 baseline</text><rect x="440" y="215" width="1040" height="72" rx="18" fill="#E8E5DE"/><rect x="440" y="215" width="346.67" height="72" rx="18" fill="#B4B6B0" filter="url(#bar-shadow)"/><text x="762.67" y="262.00" class="value" fill="#252A2A" text-anchor="end">1.00×</text><text x="62.00" y="354.00" class="row-title" >ORT–TensorRT</text><text x="62.00" y="379.00" class="row-subtitle" >off-the-shelf FP16</text><rect x="440" y="325" width="1040" height="72" rx="18" fill="#E8E5DE"/><rect x="440" y="325" width="480.13" height="72" rx="18" fill="#88A69F" filter="url(#bar-shadow)"/><text x="896.13" y="372.00" class="value" fill="#FCFBF8" text-anchor="end">1.38×</text><text x="62.00" y="494.00" class="row-title" >ORT–TensorRT</text><text x="62.00" y="519.00" class="row-subtitle" >with Sol optimizations</text><rect x="440" y="465" width="1040" height="72" rx="18" fill="#E8E5DE"/><rect x="440" y="465" width="923.88" height="72" rx="18" fill="#4F8E87" filter="url(#bar-shadow)"/><text x="1339.88" y="512.00" class="value" fill="#FCFBF8" text-anchor="end">2.67×</text><path d="M920.13 411 V427 H1354.88" fill="none" stroke="#5B7F79" stroke-width="1.7" marker-end="url(#arrow)"/><text x="1142.00" y="416.00" class="callout" text-anchor="middle">SOL: 1.92× FASTER AGAIN</text></svg>