<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title description"><title id="title">TensorRT optimization latency waterfall</title><desc id="description">Five sequential optimizations reduce measured latency from 130.49 to 49.05 milliseconds. Hierarchical Chunked TopK removes 35.85 milliseconds, Conv–BatchNorm folding removes 19.86 milliseconds, native SELU with logit-space processing removes 6.26 milliseconds, bounded ranker TopK removes 1.19 milliseconds, and the measured high-keypoint policy bypasses the ranker to remove 18.28 milliseconds.</desc><defs>
          <style>
            text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
            .eyebrow { font-size: 15px; font-weight: 500; letter-spacing: 2.1px; fill: #747C7A; }
            .title { font-size: 43px; font-weight: 500; letter-spacing: -1.15px; fill: #171A1B; }
            .subtitle { font-size: 19px; font-weight: 400; fill: #66706E; }
            .axis { font-size: 14px; font-weight: 400; fill: #737B79; }
            .bar-value { font-size: 22px; font-weight: 500; fill: #FCFBF8; }
            .delta { font-size: 18px; font-weight: 500; fill: #FCFBF8; }
            .delta-dark { font-size: 18px; font-weight: 500; fill: #8F493A; }
            .state { font-size: 15px; font-weight: 500; fill: #303635; }
            .stage { font-size: 16px; font-weight: 500; fill: #303635; }
            .stage-muted { font-size: 14px; font-weight: 400; fill: #747C7A; }
            .takeaway { font-size: 18px; font-weight: 500; fill: #303635; }
            .takeaway-value { font-size: 34px; font-weight: 500; letter-spacing: -0.7px; fill: #447E77; }
          </style>
          <filter id="bar-shadow" x="-20%" y="-15%" width="140%" height="140%">
            <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E2524" flood-opacity="0.08"/>
          </filter>
        </defs><rect width="1600" height="880" fill="#F4F2ED"/><path d="M0 790 C360 746, 745 848, 1115 790 S1460 748, 1600 785 L1600 880 L0 880 Z" fill="#ECE9E2"/><circle cx="1452" cy="54" r="151" fill="#E6ECEA" opacity="0.68"/><circle cx="1486" cy="25" r="67" fill="#F2E5DF" opacity="0.82"/><text x="62.00" y="60.00" class="eyebrow" >ORT–TENSORRT · OPTIMIZATION WATERFALL</text><text x="62.00" y="108.00" class="title" >Five changes cut latency by nearly two-thirds</text><text x="62.00" y="146.00" class="subtitle" >Sequential FP16 latency at 1,280² and K=3,584 · lower is better</text><line x1="82" y1="655.00" x2="1524" y2="655.00" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="660.00" class="axis" text-anchor="end">0</text><line x1="82" y1="593.57" x2="1524" y2="593.57" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="598.57" class="axis" text-anchor="end">20</text><line x1="82" y1="532.14" x2="1524" y2="532.14" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="537.14" class="axis" text-anchor="end">40</text><line x1="82" y1="470.71" x2="1524" y2="470.71" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="475.71" class="axis" text-anchor="end">60</text><line x1="82" y1="409.29" x2="1524" y2="409.29" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="414.29" class="axis" text-anchor="end">80</text><line x1="82" y1="347.86" x2="1524" y2="347.86" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="352.86" class="axis" text-anchor="end">100</text><line x1="82" y1="286.43" x2="1524" y2="286.43" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="291.43" class="axis" text-anchor="end">120</text><line x1="82" y1="225.00" x2="1524" y2="225.00" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="230.00" class="axis" text-anchor="end">140</text><text x="82.00" y="207.00" class="axis" >latency (ms)</text><rect x="70.00" y="254.21" width="140" height="400.79" rx="17" fill="#4F8E87" filter="url(#bar-shadow)"/><text x="140.00" y="291.21" class="bar-value" text-anchor="middle">130.49 ms</text><text x="140.00" y="704.00" class="stage" text-anchor="middle"><tspan x="140.00" dy="0">Naive</tspan><tspan x="140.00" dy="25">ORT–TensorRT</tspan></text><line x1="210.00" y1="254.21" x2="290.00" y2="254.21" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="290.00" y="254.21" width="140" height="110.11" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><text x="360.00" y="315.26" class="delta" text-anchor="middle">−35.85 ms</text><circle cx="443.00" cy="364.32" r="4" fill="#4F8E87"/><text x="453.00" y="369.32" class="state" >94.64</text><text x="360.00" y="704.00" class="stage" text-anchor="middle"><tspan x="360.00" dy="0">Hierarchical</tspan><tspan x="360.00" dy="25">chunked TopK</tspan></text><line x1="430.00" y1="364.32" x2="510.00" y2="364.32" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="510.00" y="364.32" width="140" height="61.00" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><text x="580.00" y="400.82" class="delta" text-anchor="middle">−19.86 ms</text><circle cx="663.00" cy="425.32" r="4" fill="#4F8E87"/><text x="673.00" y="430.32" class="state" >74.78</text><text x="580.00" y="704.00" class="stage" text-anchor="middle"><tspan x="580.00" dy="0">Conv–BatchNorm</tspan><tspan x="580.00" dy="25">folding</tspan></text><line x1="650.00" y1="425.32" x2="730.00" y2="425.32" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="730.00" y="425.32" width="140" height="19.23" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><line x1="800.00" y1="423.32" x2="800.00" y2="418.32" stroke="#BD6D58" stroke-width="1.4"/><text x="800.00" y="412.32" class="delta-dark" text-anchor="middle">−6.26 ms</text><circle cx="883.00" cy="444.55" r="4" fill="#4F8E87"/><text x="893.00" y="449.55" class="state" >68.52</text><text x="800.00" y="704.00" class="stage" text-anchor="middle"><tspan x="800.00" dy="0">Native SELU +</tspan><tspan x="800.00" dy="25">logit-space processing</tspan></text><line x1="870.00" y1="444.55" x2="950.00" y2="444.55" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="950.00" y="444.55" width="140" height="3.65" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><line x1="1020.00" y1="442.55" x2="1020.00" y2="433.55" stroke="#BD6D58" stroke-width="1.4"/><text x="1020.00" y="427.55" class="delta-dark" text-anchor="middle">−1.19 ms</text><circle cx="1103.00" cy="448.20" r="4" fill="#4F8E87"/><text x="1113.00" y="453.20" class="state" >67.33</text><text x="1020.00" y="704.00" class="stage" text-anchor="middle"><tspan x="1020.00" dy="0">Bounded</tspan><tspan x="1020.00" dy="25">ranker TopK</tspan></text><line x1="1090.00" y1="448.20" x2="1170.00" y2="448.20" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="1170.00" y="448.20" width="140" height="56.15" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><text x="1240.00" y="482.27" class="delta" text-anchor="middle">−18.28 ms</text><circle cx="1323.00" cy="504.35" r="4" fill="#4F8E87"/><text x="1333.00" y="509.35" class="state" >49.05</text><text x="1240.00" y="704.00" class="stage" text-anchor="middle"><tspan x="1240.00" dy="0">High-K ranker</tspan><tspan x="1240.00" dy="25">bypass</tspan></text><line x1="1310.00" y1="504.35" x2="1390.00" y2="504.35" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="1390.00" y="504.35" width="140" height="150.65" rx="17" fill="#447E77" filter="url(#bar-shadow)"/><text x="1460.00" y="541.35" class="bar-value" text-anchor="middle">49.05 ms</text><text x="1460.00" y="704.00" class="stage" text-anchor="middle"><tspan x="1460.00" dy="0">Optimized</tspan><tspan x="1460.00" dy="25">ORT–TensorRT</tspan></text><line x1="82" y1="775" x2="1524" y2="775" stroke="#D8D4CC"/><text x="82.00" y="823.00" class="eyebrow" >TOTAL REDUCTION</text><text x="278.00" y="828.00" class="takeaway-value" >−81.44 ms</text><text x="496.00" y="825.00" class="takeaway" >62.4% lower latency · 2.66× faster</text></svg>