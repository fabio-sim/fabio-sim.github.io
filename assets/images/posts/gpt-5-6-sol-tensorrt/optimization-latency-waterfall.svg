<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title description"><title id="title">TensorRT optimization latency waterfall</title><desc id="description">Four sequential optimizations reduce measured latency from 130.49 to 67.33 milliseconds. Hierarchical Chunked TopK removes 35.85 milliseconds, Conv–BatchNorm folding removes 19.86 milliseconds, native SELU with logit-space processing removes 6.26 milliseconds, and bounded ranker TopK removes 1.19 milliseconds.</desc><defs>
          <style>
            text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
            .eyebrow { font-size: 15px; font-weight: 500; letter-spacing: 2.1px; fill: #747C7A; }
            .title { font-size: 43px; font-weight: 500; letter-spacing: -1.15px; fill: #171A1B; }
            .subtitle { font-size: 19px; font-weight: 400; fill: #66706E; }
            .axis { font-size: 14px; font-weight: 400; fill: #737B79; }
            .bar-value { font-size: 22px; font-weight: 500; fill: #FCFBF8; }
            .delta { font-size: 18px; font-weight: 500; fill: #FCFBF8; }
            .delta-dark { font-size: 18px; font-weight: 500; fill: #8F493A; }
            .state { font-size: 15px; font-weight: 500; fill: #303635; }
            .stage { font-size: 16px; font-weight: 500; fill: #303635; }
            .stage-muted { font-size: 14px; font-weight: 400; fill: #747C7A; }
            .takeaway { font-size: 18px; font-weight: 500; fill: #303635; }
            .takeaway-value { font-size: 34px; font-weight: 500; letter-spacing: -0.7px; fill: #447E77; }
          </style>
          <filter id="bar-shadow" x="-20%" y="-15%" width="140%" height="140%">
            <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E2524" flood-opacity="0.08"/>
          </filter>
        </defs><rect width="1600" height="880" fill="#F4F2ED"/><path d="M0 790 C360 746, 745 848, 1115 790 S1460 748, 1600 785 L1600 880 L0 880 Z" fill="#ECE9E2"/><circle cx="1452" cy="54" r="151" fill="#E6ECEA" opacity="0.68"/><circle cx="1486" cy="25" r="67" fill="#F2E5DF" opacity="0.82"/><text x="62.00" y="60.00" class="eyebrow" >ORT–TENSORRT · OPTIMIZATION WATERFALL</text><text x="62.00" y="108.00" class="title" >Four changes nearly halve latency</text><text x="62.00" y="146.00" class="subtitle" >Sequential FP16 latency at 1,280² and K=3,584 · lower is better</text><line x1="82" y1="655.00" x2="1524" y2="655.00" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="660.00" class="axis" text-anchor="end">0</text><line x1="82" y1="593.57" x2="1524" y2="593.57" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="598.57" class="axis" text-anchor="end">20</text><line x1="82" y1="532.14" x2="1524" y2="532.14" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="537.14" class="axis" text-anchor="end">40</text><line x1="82" y1="470.71" x2="1524" y2="470.71" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="475.71" class="axis" text-anchor="end">60</text><line x1="82" y1="409.29" x2="1524" y2="409.29" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="414.29" class="axis" text-anchor="end">80</text><line x1="82" y1="347.86" x2="1524" y2="347.86" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="352.86" class="axis" text-anchor="end">100</text><line x1="82" y1="286.43" x2="1524" y2="286.43" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="291.43" class="axis" text-anchor="end">120</text><line x1="82" y1="225.00" x2="1524" y2="225.00" stroke="#DDD9D2" stroke-width="1"/><text x="65.00" y="230.00" class="axis" text-anchor="end">140</text><text x="82.00" y="207.00" class="axis" >latency (ms)</text><rect x="90.00" y="254.21" width="164" height="400.79" rx="17" fill="#4F8E87" filter="url(#bar-shadow)"/><text x="172.00" y="291.21" class="bar-value" text-anchor="middle">130.49 ms</text><text x="172.00" y="704.00" class="stage" text-anchor="middle"><tspan x="172.00" dy="0">Naive</tspan><tspan x="172.00" dy="25">ORT–TensorRT</tspan></text><line x1="254.00" y1="254.21" x2="342.00" y2="254.21" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="342.00" y="254.21" width="164" height="110.11" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><text x="424.00" y="315.26" class="delta" text-anchor="middle">−35.85 ms</text><circle cx="519.00" cy="364.32" r="4" fill="#4F8E87"/><text x="529.00" y="369.32" class="state" >94.64</text><text x="424.00" y="704.00" class="stage" text-anchor="middle"><tspan x="424.00" dy="0">Hierarchical</tspan><tspan x="424.00" dy="25">chunked TopK</tspan></text><line x1="506.00" y1="364.32" x2="594.00" y2="364.32" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="594.00" y="364.32" width="164" height="61.00" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><text x="676.00" y="400.82" class="delta" text-anchor="middle">−19.86 ms</text><circle cx="771.00" cy="425.32" r="4" fill="#4F8E87"/><text x="781.00" y="430.32" class="state" >74.78</text><text x="676.00" y="704.00" class="stage" text-anchor="middle"><tspan x="676.00" dy="0">Conv–BatchNorm</tspan><tspan x="676.00" dy="25">folding</tspan></text><line x1="758.00" y1="425.32" x2="846.00" y2="425.32" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="846.00" y="425.32" width="164" height="19.23" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><line x1="928.00" y1="423.32" x2="928.00" y2="418.32" stroke="#BD6D58" stroke-width="1.4"/><text x="928.00" y="412.32" class="delta-dark" text-anchor="middle">−6.26 ms</text><circle cx="1023.00" cy="444.55" r="4" fill="#4F8E87"/><text x="1033.00" y="449.55" class="state" >68.52</text><text x="928.00" y="704.00" class="stage" text-anchor="middle"><tspan x="928.00" dy="0">Native SELU +</tspan><tspan x="928.00" dy="25">logit-space processing</tspan></text><line x1="1010.00" y1="444.55" x2="1098.00" y2="444.55" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="1098.00" y="444.55" width="164" height="3.65" rx="8" fill="#D5775E" filter="url(#bar-shadow)"/><line x1="1180.00" y1="442.55" x2="1180.00" y2="433.55" stroke="#BD6D58" stroke-width="1.4"/><text x="1180.00" y="427.55" class="delta-dark" text-anchor="middle">−1.19 ms</text><circle cx="1275.00" cy="448.20" r="4" fill="#4F8E87"/><text x="1285.00" y="453.20" class="state" >67.33</text><text x="1180.00" y="704.00" class="stage" text-anchor="middle"><tspan x="1180.00" dy="0">Bounded</tspan><tspan x="1180.00" dy="25">ranker TopK</tspan></text><line x1="1262.00" y1="448.20" x2="1350.00" y2="448.20" stroke="#A6AEAB" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="1350.00" y="448.20" width="164" height="206.80" rx="17" fill="#447E77" filter="url(#bar-shadow)"/><text x="1432.00" y="485.20" class="bar-value" text-anchor="middle">67.33 ms</text><text x="1432.00" y="704.00" class="stage" text-anchor="middle"><tspan x="1432.00" dy="0">Optimized</tspan><tspan x="1432.00" dy="25">ORT–TensorRT</tspan></text><line x1="82" y1="775" x2="1524" y2="775" stroke="#D8D4CC"/><text x="82.00" y="823.00" class="eyebrow" >TOTAL REDUCTION</text><text x="278.00" y="828.00" class="takeaway-value" >−63.16 ms</text><text x="496.00" y="825.00" class="takeaway" >48.4% lower latency · 1.94× faster</text></svg>