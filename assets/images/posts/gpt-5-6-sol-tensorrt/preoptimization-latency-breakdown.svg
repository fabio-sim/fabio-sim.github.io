            .segment { font-size: 17px; font-weight: 500; }
            .segment-value { font-size: 14px; font-weight: 400; }
            .callout { font-size: 16px; font-weight: 500; fill: #303635; }
            .callout-value { font-size: 14px; font-weight: 400; fill: #6B7472; }
            .note { font-size: 14px; font-weight: 400; fill: #737B79; }
          </style>
