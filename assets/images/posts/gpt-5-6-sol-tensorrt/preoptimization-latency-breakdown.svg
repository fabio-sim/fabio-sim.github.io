<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" role="img" aria-labelledby="title description"><title id="title">Pre-optimization ORT–TensorRT engine latency breakdown</title><desc id="description">A proportional breakdown of 134.34 milliseconds of summed mean TensorRT layer time for the initial FP16 1280 square input and 3584 keypoint engine. Detector TopK is the largest category at about 29.5 percent.</desc><defs>
