        </defs><rect width="1600" height="730" fill="#F4F2ED"/><path d="M0 635 C370 590, 760 700, 1120 635 S1460 595, 1600 630 L1600 730 L0 730 Z" fill="#ECE9E2"/><circle cx="1452" cy="54" r="151" fill="#E6ECEA" opacity="0.68"/><circle cx="1486" cy="25" r="67" fill="#F2E5DF" opacity="0.82"/><text x="62" y="60" class="eyebrow" >ORT–TENSORRT PROFILE · BEFORE OPTIMIZATION</text><text x="62" y="108" class="title" >One TopK dominates the engine</text><text x="62" y="146" class="subtitle" >FP16 · 1,280² · K=3,584 · 50 profiled calls · 134.34 ms summed mean layer time</text><line x1="70.00" y1="226" x2="70.00" y2="410" stroke="#DDD9D2" stroke-width="1"/><text x="70.0" y="214" class="axis" text-anchor="middle">0 ms</text><line x1="341.69" y1="226" x2="341.69" y2="410" stroke="#DDD9D2" stroke-width="1"/><text x="341.6906173926264" y="214" class="axis" text-anchor="middle">25 ms</text><line x1="613.38" y1="226" x2="613.38" y2="410" stroke="#DDD9D2" stroke-width="1"/><text x="613.3812347852528" y="214" class="axis" text-anchor="middle">50 ms</text><line x1="885.07" y1="226" x2="885.07" y2="410" stroke="#DDD9D2" stroke-width="1"/><text x="885.0718521778792" y="214" class="axis" text-anchor="middle">75 ms</text><line x1="1156.76" y1="226" x2="1156.76" y2="410" stroke="#DDD9D2" stroke-width="1"/><text x="1156.7624695705056" y="214" class="axis" text-anchor="middle">100 ms</text><line x1="1428.45" y1="226" x2="1428.45" y2="410" stroke="#DDD9D2" stroke-width="1"/><text x="1428.4530869631321" y="214" class="axis" text-anchor="middle">125 ms</text><line x1="1530" y1="226" x2="1530" y2="410" stroke="#DDD9D2" stroke-width="1"/><text x="1530" y="242" class="axis" text-anchor="end">134.34 ms</text><g filter="url(#bar-shadow)"><rect x="70" y="255" width="1460" height="142" rx="22" fill="#FCFBF8"/></g><g clip-path="url(#bar-clip)"><rect x="70.00" y="255" width="431.84" height="142" fill="#D5775E"/><rect x="501.34" y="255" width="285.63" height="142" fill="#4F8E87"/><rect x="786.47" y="255" width="201.45" height="142" fill="#68839C"/><rect x="987.42" y="255" width="163.19" height="142" fill="#88A69F"/><rect x="1150.12" y="255" width="139.97" height="142" fill="#D8A394"/><rect x="1289.59" y="255" width="92.38" height="142" fill="#B4B6B0"/><rect x="1381.47" y="255" width="70.65" height="142" fill="#99ACB8"/><rect x="1451.62" y="255" width="53.62" height="142" fill="#8798AD"/><rect x="1504.74" y="255" width="25.76" height="142" fill="#767E7C"/></g><text x="285.6723189125246" y="318" class="segment" fill="#FCFBF8" text-anchor="middle">Detector TopK</text><text x="285.6723189125246" y="347" class="segment-value" fill="#FCFBF8" text-anchor="middle">39.69 ms · 29.5%</text><text x="643.9072409401722" y="318" class="segment" fill="#FCFBF8" text-anchor="middle">Convolution</text><text x="643.9072409401722" y="347" class="segment-value" fill="#FCFBF8" text-anchor="middle">26.24 ms · 19.5%</text><text x="886.9473255301239" y="318" class="segment" fill="#FCFBF8" text-anchor="middle">Fused / Myelin</text><text x="886.9473255301239" y="347" class="segment-value" fill="#FCFBF8" text-anchor="middle">18.49 ms · 13.8%</text><text x="1068.7713702891588" y="318" class="segment" fill="#202524" text-anchor="middle">Pointwise</text><text x="1068.7713702891588" y="347" class="segment-value" fill="#202524" text-anchor="middle">14.97 ms · 11.1%</text><text x="1219.852518165112" y="318" class="segment" fill="#202524" text-anchor="middle">BatchNorm</text><text x="1219.852518165112" y="347" class="segment-value" fill="#202524" text-anchor="middle">12.83 ms · 9.6%</text><path d="M1335.53 397 V433 H1115" fill="none" stroke="#B4B6B0" stroke-width="1.6" opacity="0.88"/><circle cx="1115" cy="433" r="4" fill="#B4B6B0"/><text x="1115" y="463" class="callout" text-anchor="middle">Other</text><text x="1115" y="488" class="callout-value" text-anchor="middle">8.45 ms · 6.3%</text><path d="M1416.55 397 V495 H1270" fill="none" stroke="#99ACB8" stroke-width="1.6" opacity="0.88"/><circle cx="127